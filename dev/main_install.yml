
- block:
    - name: detect composer
      stat:
        path: "{{ code_dir }}/{{ use_project }}/composer.phar"
      register: st
    - name: download composer 2.9.2 (pinned)
      ansible.builtin.get_url:
        url: https://getcomposer.org/download/2.9.2/composer.phar
        dest: "{{ code_dir }}/{{ use_project }}/composer.phar"
      when: not st.stat.exists
    - name: mark all repos safe in container (system config)
      ansible.builtin.command: >
        docker exec -i -u root app git config --system --add safe.directory '*'
      changed_when: true

    - name: composer install
      ansible.builtin.include_tasks: "{{ playbook_dir }}/main_tooling.yml"
      vars:
        tooling_cmd: "php ./composer.phar install -q {{ composer_install_source }}"

    - name: set up app
      ansible.builtin.expect:
        command: >-
          docker compose
          -f {{ (app_compose_files | select('file') | list) | join(' -f ') }}
          --env-file {{ env_file }}
          --project-directory {{ compose_project_dir }}
          run --rm {{ tooling_service }}
          -lc "php ./vendor/bin/empathy --new_app"
        responses:
          'Please enter document root': "/var/www/project"
          'Please enter name': "{{ use_project }}"
          'Please enter web root': "www.dev.org"
        echo: true  
      delegate_to: localhost
      run_once: true
      when: operation == "qs"

    - name: add bootstrap theming
      block:
        - name: copy variables file  
          copy:
           src: "{{ playbook_dir }}/env/templates/elib-blog/public_html/css/scss/_variables.scss.j2"
           dest: "{{ code_dir }}/{{ use_project }}/public_html/css/scss/_variables.scss"
        - name: append blog.scss.j2 to end of style.scss
          ansible.builtin.blockinfile:
            path: "{{ code_dir }}/{{ use_project }}/public_html/css/scss/style.scss"
            block: "{{ lookup('file', playbook_dir ~ '/env/templates/elib-blog/public_html/css/scss/blog.scss.j2') }}"
            insertafter: EOF
            marker: "/* {mark} ANSIBLE MANAGED BLOCK blog.scss.j2 */"
          delegate_to: localhost
          run_once: true     
      when: operation == "qs" and template == "elib-blog"

    - name: clear node_modules
      file:
        path: "{{ code_dir }}/{{ use_project }}/node_modules"
        state: absent

    - name: npm install
      ansible.builtin.include_tasks: "{{ playbook_dir }}/main_tooling.yml"
      vars:
        tooling_cmd: "npm install --bin-links=false"

    - name: grunt
      ansible.builtin.include_tasks: "{{ playbook_dir }}/main_tooling.yml"
      vars:
        tooling_cmd: "make grunt"
      when: operation == "qs"

    - name: remix
      block:
        - name: extract react files
          ansible.builtin.unarchive:
            src: "{{ playbook_dir }}/env/templates/elib-cms/react.zip"
            dest: "{{ code_dir }}/{{ use_project }}"
        - name: populate build.xml
          template:
            src: "{{ playbook_dir }}/env/templates/elib-cms/build.j2"
            dest: "{{ code_dir }}/{{ use_project }}/build.xml"
        
        - name: build react
          ansible.builtin.include_tasks: "{{ playbook_dir }}/main_tooling.yml"
          vars:
            tooling_cmd: "ant remix"

      when: operation == "qs" and template == "elib-cms"

  vars:
    compose_project_dir: "{{ playbook_dir }}"
    app_compose_files:
      - "{{ compose_project_dir }}/docker-compose.yml"
      - "{{ compose_project_dir }}/docker-compose.partial.yml"
    env_file: "{{ code_dir }}/{{ use_project }}/.env"
    tooling_service: tooling



