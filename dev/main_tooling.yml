

- block:

    - name: ensure npm cache writable
      ansible.builtin.command: >-
        docker compose -f {{ compose_project_dir }}/docker-compose.yml
        --env-file {{ env_file_path }}
        --project-directory {{ compose_project_dir }}
        run --rm --user 0:0 tooling -lc
        "mkdir -p /tmp/npm-cache && chown -R {{ lookup('env','UID') | default('1001') }}:{{ lookup('env','GID') | default('1001') }} /tmp/npm-cache"

    - name: run tooling command via docker compose
      ansible.builtin.command: >-
        docker compose
        -f {{ (app_compose_files | select('file') | list) | join(' -f ') }}
        --env-file {{ env_file_path }}
        --project-directory {{ compose_project_dir }}
        run --rm {{ tooling_service }}
        -lc {{ tooling_cmd | quote }}
      run_once: true
      register: tooling_cmd_result

    - name: expose tooling result
      ansible.builtin.set_fact:
        tooling_output: "{{ tooling_cmd_result }}"      
  vars:
    compose_project_dir: "{{ playbook_dir }}"
    app_compose_files:
      - "{{ compose_project_dir }}/docker-compose.yml"
      - "{{ compose_project_dir }}/docker-compose.partial.yml"
    env_file_path: "{{ lookup('env','HOME') }}/code/{{ use_project }}/.env"
    tooling_service: tooling
    tooling_cmd: "composer install"
