

- hosts: test
  gather_facts: false
  vars_files:
    - ~/.config/base-docker/settings.yml
  tasks:
    - name: read encrypted values
      include_vars:
        file: "~/.config/base-docker/secrets.yml"
        name: secrets_vals
    # - name: read site encrypted values
    #   include_vars:
    #     file: "~/.config/base-docker/site_secrets.yml"
    #     name: site_secrets_vals
    # - name: debug
    #   debug:
    #     var: site_secrets_vals
    - name: copy secrets file
      copy:
        src: "~/.config/base-docker/site_secrets.yml"
        dest: "/home/{{ ansible_user }}/jenkins/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        decrypt: false


- hosts: control
  gather_facts: false
  tasks:
    - name: remove temp pem file
      ansible.builtin.file:
        path: /tmp/private.pem
        state: absent
